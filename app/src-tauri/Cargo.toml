[package]
name = "embervale-map"
version = "1.0.2"
edition = "2021"
description = "Mapa de Embervale com a posição do jogador em tempo real"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "=0.14.0"
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
